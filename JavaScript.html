<script>
// ==================== VARIAVEIS GLOBAIS ====================
var clientes = [];
var orcamentos = [];
var ordensServico = [];
var pecas = [];
var configuracoes = {};
var emailTemplates = [];

// Contadores de itens nos formularios
var contadorItemOrcamento = 0;
var contadorItemOS = 0;

// ==================== INICIALIZACAO ====================

document.addEventListener('DOMContentLoaded', function() {
  inicializarSistema();
});

function inicializarSistema() {
  showLoading();
  google.script.run
    .withSuccessHandler(function(result) {
      carregarDados();
    })
    .withFailureHandler(function(error) {
      hideLoading();
      showToast('Erro ao inicializar: ' + error.message, 'error');
    })
    .inicializarSistema();
}

function carregarDados() {
  var loaded = 0;
  var total = 6;

  function checkLoaded() {
    loaded++;
    if (loaded >= total) {
      atualizarInterface();
      hideLoading();
      showToast('Sistema carregado com sucesso!', 'success');
    }
  }

  google.script.run.withSuccessHandler(function(data) {
    clientes = data || [];
    checkLoaded();
  }).getClientes();

  google.script.run.withSuccessHandler(function(data) {
    orcamentos = data || [];
    checkLoaded();
  }).getOrcamentos();

  google.script.run.withSuccessHandler(function(data) {
    ordensServico = data || [];
    checkLoaded();
  }).getOrdensServico();

  google.script.run.withSuccessHandler(function(data) {
    pecas = data || [];
    checkLoaded();
  }).getPecas();

  google.script.run.withSuccessHandler(function(data) {
    configuracoes = data || {};
    checkLoaded();
  }).getConfiguracoes();

  google.script.run.withSuccessHandler(function(data) {
    emailTemplates = data || [];
    checkLoaded();
  }).getEmailTemplates();
}

function sincronizarDados() {
  showLoading();
  carregarDados();
}

function atualizarInterface() {
  atualizarBadges();
  atualizarDashboard();
  renderizarClientes();
  renderizarOrcamentos();
  renderizarOS();
  renderizarPecas();
  renderizarEmailTemplates();
  carregarConfiguracoes();
  popularSelectClientes();
  popularSelectFormasPagamento();
}

// ==================== FUNCOES DE NAVEGACAO ====================

function showSection(sectionId) {
  var sections = document.querySelectorAll('.section');
  for (var i = 0; i < sections.length; i++) {
    sections[i].classList.remove('active');
  }

  var navItems = document.querySelectorAll('.nav-item');
  for (var i = 0; i < navItems.length; i++) {
    navItems[i].classList.remove('active');
  }

  document.getElementById('section-' + sectionId).classList.add('active');
  document.querySelector('[data-section="' + sectionId + '"]').classList.add('active');

  if (window.innerWidth <= 992) {
    document.getElementById('sidebar').classList.remove('show');
  }

  return false;
}

function toggleSidebar() {
  var sidebar = document.getElementById('sidebar');
  sidebar.classList.toggle('show');
}

// ==================== FUNCOES DE LOADING E TOAST ====================

function showLoading() {
  document.getElementById('loadingOverlay').classList.remove('hidden');
}

function hideLoading() {
  document.getElementById('loadingOverlay').classList.add('hidden');
}

function showToast(message, type) {
  type = type || 'info';
  var container = document.getElementById('toastContainer');
  var toast = document.createElement('div');
  toast.className = 'toast ' + type;

  var icons = {
    success: 'fa-check-circle',
    error: 'fa-times-circle',
    warning: 'fa-exclamation-triangle',
    info: 'fa-info-circle'
  };

  toast.innerHTML = '<i class="fas ' + icons[type] + '"></i> ' + message;
  container.appendChild(toast);

  setTimeout(function() {
    toast.style.animation = 'toastOut 0.3s ease forwards';
    setTimeout(function() {
      if (toast.parentNode) {
        toast.parentNode.removeChild(toast);
      }
    }, 300);
  }, 4000);
}

// ==================== FUNCOES DE MODAL ====================

function abrirModal(modalId) {
  document.getElementById(modalId).classList.add('show');
}

function fecharModal(modalId) {
  document.getElementById(modalId).classList.remove('show');
}

document.addEventListener('click', function(e) {
  if (e.target.classList.contains('modal') && e.target.classList.contains('show')) {
    e.target.classList.remove('show');
  }
});

// ==================== DASHBOARD ====================

function atualizarDashboard() {
  google.script.run
    .withSuccessHandler(function(data) {
      document.getElementById('statClientes').textContent = data.clientes;
      document.getElementById('statOrcPendentes').textContent = data.orcamentos.pendentes;
      document.getElementById('statOSAndamento').textContent = data.ordensServico.emAndamento;
      document.getElementById('statOSConcluidas').textContent = data.ordensServico.concluidas;
      document.getElementById('statEstoqueBaixo').textContent = data.estoque.estoqueBaixo;
      document.getElementById('statTotalMes').textContent = 'R$ ' + formatarMoeda(data.financeiro.totalMes);

      var tbodyOrc = document.querySelector('#tabelaUltimosOrcamentos tbody');
      tbodyOrc.innerHTML = '';
      for (var i = 0; i < data.ultimosOrcamentos.length; i++) {
        var orc = data.ultimosOrcamentos[i];
        tbodyOrc.innerHTML += '<tr>' +
          '<td>' + orc.Numero + '</td>' +
          '<td>' + orc.ClienteNome + '</td>' +
          '<td>' + orc.DataCriacao + '</td>' +
          '<td>R$ ' + formatarMoeda(orc.TotalGeral) + '</td>' +
          '<td>' + getStatusBadge(orc.Status) + '</td>' +
          '</tr>';
      }

      var tbodyOS = document.querySelector('#tabelaUltimasOS tbody');
      tbodyOS.innerHTML = '';
      for (var i = 0; i < data.ultimasOS.length; i++) {
        var os = data.ultimasOS[i];
        tbodyOS.innerHTML += '<tr>' +
          '<td>' + os.Numero + '</td>' +
          '<td>' + os.ClienteNome + '</td>' +
          '<td>' + os.DataCriacao + '</td>' +
          '<td>R$ ' + formatarMoeda(os.TotalGeral) + '</td>' +
          '<td>' + getStatusBadge(os.Status) + '</td>' +
          '</tr>';
      }
    })
    .getDashboardData();
}

function atualizarBadges() {
  document.getElementById('badgeClientes').textContent = clientes.length;

  var orcPendentes = 0;
  for (var i = 0; i < orcamentos.length; i++) {
    if (orcamentos[i].Status === 'Pendente') orcPendentes++;
  }
  document.getElementById('badgeOrcamentos').textContent = orcPendentes;

  var osAndamento = 0;
  for (var i = 0; i < ordensServico.length; i++) {
    if (ordensServico[i].Status === 'Em Andamento') osAndamento++;
  }
  document.getElementById('badgeOS').textContent = osAndamento;

  var estoqueBaixo = 0;
  for (var i = 0; i < pecas.length; i++) {
    if (pecas[i].EstoqueAtual <= pecas[i].EstoqueMinimo) estoqueBaixo++;
  }
  document.getElementById('badgeEstoque').textContent = estoqueBaixo;
}

function getStatusBadge(status) {
  var statusClasses = {
    'Pendente': 'status-pendente',
    'Aprovado': 'status-aprovado',
    'Cancelado': 'status-cancelado',
    'Em Andamento': 'status-andamento',
    'Concluida': 'status-concluida',
    'Cancelada': 'status-cancelado'
  };

  return '<span class="status ' + (statusClasses[status] || '') + '">' + status + '</span>';
}

// ==================== CLIENTES ====================

function renderizarClientes() {
  var tbody = document.querySelector('#tabelaClientes tbody');
  tbody.innerHTML = '';

  for (var i = 0; i < clientes.length; i++) {
    var cliente = clientes[i];
    tbody.innerHTML += '<tr>' +
      '<td>' + cliente.Nome + '</td>' +
      '<td>' + (cliente.CPF_CNPJ || '-') + '</td>' +
      '<td>' + cliente.Telefone + '</td>' +
      '<td>' + (cliente.Email || '-') + '</td>' +
      '<td>' + (cliente.Cidade || '-') + '</td>' +
      '<td>' +
        '<div class="btn-group">' +
          '<button class="btn btn-sm btn-primary btn-action" onclick="editarCliente(' + cliente.ID + ')" title="Editar">' +
            '<i class="fas fa-edit"></i>' +
          '</button>' +
          '<button class="btn btn-sm btn-danger btn-action" onclick="confirmarExclusaoCliente(' + cliente.ID + ')" title="Excluir">' +
            '<i class="fas fa-trash"></i>' +
          '</button>' +
        '</div>' +
      '</td>' +
      '</tr>';
  }
}

function filtrarClientes() {
  var busca = document.getElementById('buscaCliente').value.toLowerCase();
  var linhas = document.querySelectorAll('#tabelaClientes tbody tr');

  for (var i = 0; i < linhas.length; i++) {
    var texto = linhas[i].textContent.toLowerCase();
    linhas[i].style.display = texto.indexOf(busca) >= 0 ? '' : 'none';
  }
}

function abrirModalCliente(id) {
  limparFormCliente();
  document.getElementById('modalClienteTitulo').innerHTML = '<i class="fas fa-user-plus"></i> ' + (id ? 'Editar Cliente' : 'Novo Cliente');
  abrirModal('modalCliente');
}

function limparFormCliente() {
  document.getElementById('formCliente').reset();
  document.getElementById('clienteId').value = '';
}

function editarCliente(id) {
  var cliente = null;
  for (var i = 0; i < clientes.length; i++) {
    if (clientes[i].ID == id) {
      cliente = clientes[i];
      break;
    }
  }
  if (!cliente) return;

  document.getElementById('clienteId').value = cliente.ID;
  document.getElementById('clienteNome').value = cliente.Nome;
  document.getElementById('clienteCpfCnpj').value = cliente.CPF_CNPJ || '';
  document.getElementById('clienteTelefone').value = cliente.Telefone;
  document.getElementById('clienteEmail').value = cliente.Email || '';
  document.getElementById('clienteEndereco').value = cliente.Endereco || '';
  document.getElementById('clienteCidade').value = cliente.Cidade || '';
  document.getElementById('clienteEstado').value = cliente.Estado || '';
  document.getElementById('clienteCep').value = cliente.CEP || '';
  document.getElementById('clienteObservacoes').value = cliente.Observacoes || '';

  document.getElementById('modalClienteTitulo').innerHTML = '<i class="fas fa-user-edit"></i> Editar Cliente';
  abrirModal('modalCliente');
}

function salvarClienteForm() {
  var dados = {
    ID: document.getElementById('clienteId').value || null,
    Nome: document.getElementById('clienteNome').value,
    CPF_CNPJ: document.getElementById('clienteCpfCnpj').value,
    Telefone: document.getElementById('clienteTelefone').value,
    Email: document.getElementById('clienteEmail').value,
    Endereco: document.getElementById('clienteEndereco').value,
    Cidade: document.getElementById('clienteCidade').value,
    Estado: document.getElementById('clienteEstado').value,
    CEP: document.getElementById('clienteCep').value,
    Observacoes: document.getElementById('clienteObservacoes').value
  };

  if (!dados.Nome || !dados.Telefone) {
    showToast('Preencha os campos obrigatorios!', 'warning');
    return;
  }

  showLoading();
  google.script.run
    .withSuccessHandler(function(result) {
      hideLoading();
      if (result.success) {
        showToast(result.message, 'success');
        fecharModal('modalCliente');
        sincronizarDados();
      } else {
        showToast(result.message, 'error');
      }
    })
    .withFailureHandler(function(error) {
      hideLoading();
      showToast('Erro: ' + error.message, 'error');
    })
    .salvarCliente(dados);
}

function confirmarExclusaoCliente(id) {
  if (confirm('Tem certeza que deseja excluir este cliente?')) {
    showLoading();
    google.script.run
      .withSuccessHandler(function(result) {
        hideLoading();
        if (result.success) {
          showToast(result.message, 'success');
          sincronizarDados();
        } else {
          showToast(result.message, 'error');
        }
      })
      .excluirCliente(id);
  }
}

function popularSelectClientes() {
  var selects = ['orcamentoClienteId', 'osClienteId'];

  for (var s = 0; s < selects.length; s++) {
    var select = document.getElementById(selects[s]);
    if (!select) continue;

    var valorAtual = select.value;
    select.innerHTML = '<option value="">Selecione...</option>';

    for (var i = 0; i < clientes.length; i++) {
      select.innerHTML += '<option value="' + clientes[i].ID + '">' + clientes[i].Nome + '</option>';
    }

    if (valorAtual) select.value = valorAtual;
  }
}

function preencherDadosCliente(tipo) {
  var clienteId = document.getElementById(tipo + 'ClienteId').value;
  var cliente = null;
  for (var i = 0; i < clientes.length; i++) {
    if (clientes[i].ID == clienteId) {
      cliente = clientes[i];
      break;
    }
  }

  var infoDiv = document.getElementById(tipo + 'ClienteInfo');
  if (!cliente) {
    infoDiv.style.display = 'none';
    return;
  }

  infoDiv.style.display = 'block';
  document.getElementById(tipo + 'ClienteEmail').textContent = cliente.Email || 'Nao informado';
  document.getElementById(tipo + 'ClienteTelefone').textContent = cliente.Telefone;

  var enderecoEl = document.getElementById(tipo + 'ClienteEndereco');
  if (enderecoEl) {
    var partes = [];
    if (cliente.Endereco) partes.push(cliente.Endereco);
    if (cliente.Cidade) partes.push(cliente.Cidade);
    if (cliente.Estado) partes.push(cliente.Estado);
    enderecoEl.textContent = partes.join(', ') || 'Nao informado';
  }
}

// ==================== ORCAMENTOS ====================

function renderizarOrcamentos() {
  var tbody = document.querySelector('#tabelaOrcamentos tbody');
  tbody.innerHTML = '';

  for (var i = 0; i < orcamentos.length; i++) {
    var orc = orcamentos[i];
    var acoes = '<button class="btn btn-sm btn-primary btn-action" onclick="visualizarOrcamento(' + orc.ID + ')" title="Visualizar">' +
      '<i class="fas fa-eye"></i></button>';

    if (orc.Status === 'Pendente') {
      acoes += '<button class="btn btn-sm btn-success btn-action" onclick="abrirModalAprovar(' + orc.ID + ')" title="Aprovar">' +
        '<i class="fas fa-check"></i></button>' +
        '<button class="btn btn-sm btn-warning btn-action" onclick="editarOrcamento(' + orc.ID + ')" title="Editar">' +
        '<i class="fas fa-edit"></i></button>' +
        '<button class="btn btn-sm btn-danger btn-action" onclick="abrirModalCancelar(' + orc.ID + ', \'ORCAMENTO\')" title="Cancelar">' +
        '<i class="fas fa-times"></i></button>';
    }

    tbody.innerHTML += '<tr>' +
      '<td><strong>' + orc.Numero + '</strong></td>' +
      '<td>' + orc.ClienteNome + '</td>' +
      '<td>' + orc.DataCriacao + '</td>' +
      '<td>' + orc.DataValidade + '</td>' +
      '<td>R$ ' + formatarMoeda(orc.TotalGeral) + '</td>' +
      '<td>' + getStatusBadge(orc.Status) + '</td>' +
      '<td><div class="btn-group">' + acoes + '</div></td>' +
      '</tr>';
  }
}

function filtrarOrcamentos() {
  var busca = document.getElementById('buscaOrcamento').value.toLowerCase();
  var status = document.getElementById('filtroStatusOrc').value;
  var linhas = document.querySelectorAll('#tabelaOrcamentos tbody tr');

  for (var i = 0; i < linhas.length; i++) {
    var texto = linhas[i].textContent.toLowerCase();
    var statusEl = linhas[i].querySelector('.status');
    var statusLinha = statusEl ? statusEl.textContent : '';

    var matchBusca = texto.indexOf(busca) >= 0;
    var matchStatus = !status || statusLinha === status;

    linhas[i].style.display = matchBusca && matchStatus ? '' : 'none';
  }
}

function abrirModalOrcamento() {
  limparFormOrcamento();
  popularSelectClientes();
  popularSelectFormasPagamento();
  document.getElementById('modalOrcamentoTitulo').innerHTML = '<i class="fas fa-file-invoice-dollar"></i> Novo Orcamento';
  document.getElementById('orcamentoGarantia').value = configuracoes.GARANTIA_PADRAO || '90 dias';
  abrirModal('modalOrcamento');
}

function limparFormOrcamento() {
  document.getElementById('formOrcamento').reset();
  document.getElementById('orcamentoId').value = '';
  document.getElementById('orcamentoClienteInfo').style.display = 'none';
  document.querySelector('#tabelaItensOrcamento tbody').innerHTML = '';
  document.getElementById('orcamentoTotalPecas').value = '0,00';
  document.getElementById('orcamentoTotalMaoObra').value = '0,00';
  document.getElementById('orcamentoTotalGeral').value = '0,00';
  contadorItemOrcamento = 0;
}

function editarOrcamento(id) {
  showLoading();
  google.script.run
    .withSuccessHandler(function(orc) {
      hideLoading();
      if (!orc) {
        showToast('Orcamento nao encontrado!', 'error');
        return;
      }

      document.getElementById('orcamentoId').value = orc.ID;
      document.getElementById('orcamentoClienteId').value = orc.ClienteID;
      preencherDadosCliente('orcamento');
      document.getElementById('orcamentoDescricao').value = orc.Descricao || '';
      document.getElementById('orcamentoDesconto').value = orc.Desconto || 0;
      document.getElementById('orcamentoGarantia').value = orc.Garantia || '';
      document.getElementById('orcamentoFormaPagamento').value = orc.FormaPagamento || '';
      document.getElementById('orcamentoObservacoes').value = orc.Observacoes || '';

      var tbody = document.querySelector('#tabelaItensOrcamento tbody');
      tbody.innerHTML = '';
      contadorItemOrcamento = 0;

      if (orc.Itens) {
        for (var i = 0; i < orc.Itens.length; i++) {
          var item = orc.Itens[i];
          adicionarLinhaItemOrcamento(item.Tipo, item.PecaID, item.Descricao, item.Quantidade, item.PrecoUnitario);
        }
      }

      calcularTotalOrcamento();
      document.getElementById('modalOrcamentoTitulo').innerHTML = '<i class="fas fa-edit"></i> Editar Orcamento';
      abrirModal('modalOrcamento');
    })
    .getOrcamentoById(id);
}

function adicionarItemOrcamento(tipo) {
  if (tipo === 'peca') {
    abrirModalSelecionarPeca('orcamento');
  } else {
    adicionarLinhaItemOrcamento('Servico', '', '', 1, 0);
  }
}

function adicionarLinhaItemOrcamento(tipo, pecaId, descricao, quantidade, precoUnit) {
  contadorItemOrcamento++;
  var tbody = document.querySelector('#tabelaItensOrcamento tbody');

  var tipoLabel = tipo === 'Peca' ? '<span class="status status-pendente">Peca</span>' : '<span class="status status-andamento">Servico</span>';

  var tr = document.createElement('tr');
  tr.id = 'itemOrc' + contadorItemOrcamento;
  tr.setAttribute('data-tipo', tipo);
  tr.setAttribute('data-peca-id', pecaId || '');

  tr.innerHTML = '<td>' + tipoLabel + '</td>' +
    '<td><input type="text" class="form-control" value="' + descricao + '" onchange="calcularTotalOrcamento()"></td>' +
    '<td style="width:80px"><input type="number" class="form-control" value="' + quantidade + '" min="1" onchange="calcularTotalOrcamento()"></td>' +
    '<td style="width:120px"><input type="number" class="form-control" value="' + precoUnit + '" step="0.01" onchange="calcularTotalOrcamento()"></td>' +
    '<td style="width:120px"><input type="text" class="form-control" value="' + formatarMoeda(quantidade * precoUnit) + '" readonly></td>' +
    '<td style="width:50px">' +
      '<button class="btn btn-sm btn-danger btn-action" onclick="removerItemOrcamento(' + contadorItemOrcamento + ')">' +
        '<i class="fas fa-trash"></i>' +
      '</button>' +
    '</td>';

  tbody.appendChild(tr);
  calcularTotalOrcamento();
}

function removerItemOrcamento(id) {
  var el = document.getElementById('itemOrc' + id);
  if (el) el.parentNode.removeChild(el);
  calcularTotalOrcamento();
}

function calcularTotalOrcamento() {
  var totalPecas = 0;
  var totalMaoObra = 0;

  var linhas = document.querySelectorAll('#tabelaItensOrcamento tbody tr');
  for (var i = 0; i < linhas.length; i++) {
    var tr = linhas[i];
    var tipo = tr.getAttribute('data-tipo');
    var inputs = tr.querySelectorAll('input');
    var qtd = parseFloat(inputs[1].value) || 0;
    var preco = parseFloat(inputs[2].value) || 0;
    var total = qtd * preco;

    inputs[3].value = formatarMoeda(total);

    if (tipo === 'Peca') {
      totalPecas += total;
    } else {
      totalMaoObra += total;
    }
  }

  var desconto = parseFloat(document.getElementById('orcamentoDesconto').value) || 0;
  var totalGeral = totalPecas + totalMaoObra - desconto;

  document.getElementById('orcamentoTotalPecas').value = formatarMoeda(totalPecas);
  document.getElementById('orcamentoTotalMaoObra').value = formatarMoeda(totalMaoObra);
  document.getElementById('orcamentoTotalGeral').value = formatarMoeda(totalGeral);
}

function salvarOrcamentoForm() {
  var clienteId = document.getElementById('orcamentoClienteId').value;
  if (!clienteId) {
    showToast('Selecione um cliente!', 'warning');
    return;
  }

  var descricao = document.getElementById('orcamentoDescricao').value;
  if (!descricao) {
    showToast('Preencha a descricao do servico!', 'warning');
    return;
  }

  var itens = [];
  var linhas = document.querySelectorAll('#tabelaItensOrcamento tbody tr');
  for (var i = 0; i < linhas.length; i++) {
    var tr = linhas[i];
    var inputs = tr.querySelectorAll('input');
    itens.push({
      Tipo: tr.getAttribute('data-tipo'),
      PecaID: tr.getAttribute('data-peca-id') || '',
      Descricao: inputs[0].value,
      Quantidade: parseFloat(inputs[1].value) || 0,
      PrecoUnitario: parseFloat(inputs[2].value) || 0,
      PrecoTotal: parseMoeda(inputs[3].value)
    });
  }

  var dados = {
    ID: document.getElementById('orcamentoId').value || null,
    ClienteID: clienteId,
    Descricao: descricao,
    TotalPecas: parseMoeda(document.getElementById('orcamentoTotalPecas').value),
    TotalMaoObra: parseMoeda(document.getElementById('orcamentoTotalMaoObra').value),
    Desconto: parseFloat(document.getElementById('orcamentoDesconto').value) || 0,
    TotalGeral: parseMoeda(document.getElementById('orcamentoTotalGeral').value),
    Garantia: document.getElementById('orcamentoGarantia').value,
    FormaPagamento: document.getElementById('orcamentoFormaPagamento').value,
    Observacoes: document.getElementById('orcamentoObservacoes').value,
    Itens: itens,
    enviarEmail: document.getElementById('orcamentoEnviarEmail').checked
  };

  showLoading();
  google.script.run
    .withSuccessHandler(function(result) {
      hideLoading();
      if (result.success) {
        showToast(result.message, 'success');
        fecharModal('modalOrcamento');
        sincronizarDados();
      } else {
        showToast(result.message, 'error');
      }
    })
    .withFailureHandler(function(error) {
      hideLoading();
      showToast('Erro: ' + error.message, 'error');
    })
    .salvarOrcamento(dados);
}

function abrirModalAprovar(id) {
  document.getElementById('aprovarOrcamentoId').value = id;
  abrirModal('modalAprovarOrcamento');
}

function confirmarAprovacao() {
  var id = document.getElementById('aprovarOrcamentoId').value;
  var dataPrevista = document.getElementById('aprovarDataPrevista').value;

  showLoading();
  google.script.run
    .withSuccessHandler(function(result) {
      hideLoading();
      if (result.success) {
        showToast(result.message, 'success');
        fecharModal('modalAprovarOrcamento');
        sincronizarDados();
      } else {
        showToast(result.message, 'error');
      }
    })
    .withFailureHandler(function(error) {
      hideLoading();
      showToast('Erro: ' + error.message, 'error');
    })
    .aprovarOrcamento(id, dataPrevista);
}

function abrirModalCancelar(id, tipo) {
  document.getElementById('cancelarId').value = id;
  document.getElementById('cancelarTipo').value = tipo;
  document.getElementById('cancelarMotivo').value = '';
  abrirModal('modalCancelar');
}

function confirmarCancelamento() {
  var id = document.getElementById('cancelarId').value;
  var tipo = document.getElementById('cancelarTipo').value;
  var motivo = document.getElementById('cancelarMotivo').value;

  if (!motivo) {
    showToast('Informe o motivo do cancelamento!', 'warning');
    return;
  }

  showLoading();

  var successHandler = function(result) {
    hideLoading();
    if (result.success) {
      showToast(result.message, 'success');
      fecharModal('modalCancelar');
      sincronizarDados();
    } else {
      showToast(result.message, 'error');
    }
  };

  var failureHandler = function(error) {
    hideLoading();
    showToast('Erro: ' + error.message, 'error');
  };

  if (tipo === 'ORCAMENTO') {
    google.script.run
      .withSuccessHandler(successHandler)
      .withFailureHandler(failureHandler)
      .cancelarOrcamento(id, motivo);
  } else {
    google.script.run
      .withSuccessHandler(successHandler)
      .withFailureHandler(failureHandler)
      .cancelarOrdemServico(id, motivo);
  }
}

function filtrarOS() {
  var busca = document.getElementById('buscaOS').value.toLowerCase();
  var status = document.getElementById('filtroStatusOS').value;
  var linhas = document.querySelectorAll('#tabelaOS tbody tr');

  for (var i = 0; i < linhas.length; i++) {
    var texto = linhas[i].textContent.toLowerCase();
    var statusEl = linhas[i].querySelector('.status');
    var statusLinha = statusEl ? statusEl.textContent : '';

    var matchBusca = texto.indexOf(busca) >= 0;
    var matchStatus = !status || statusLinha === status;

    linhas[i].style.display = matchBusca && matchStatus ? '' : 'none';
  }
}

function editarOS(id) {
  showLoading();
  google.script.run
    .withSuccessHandler(function(os) {
      hideLoading();
      if (!os) {
        showToast('OS nao encontrada!', 'error');
        return;
      }

      document.getElementById('osId').value = os.ID;
      document.getElementById('osClienteId').value = os.ClienteID;
      preencherDadosCliente('os');
      document.getElementById('osDataPrevista').value = os.DataPrevista ? formatarDataInput(os.DataPrevista) : '';
      document.getElementById('osTecnico').value = os.Tecnico || '';
      document.getElementById('osDescricao').value = os.Descricao || '';
      document.getElementById('osDesconto').value = os.Desconto || 0;

      document.getElementById('osObservacoes').value = os.Observacoes || '';

      var tbody = document.querySelector('#tabelaItensOS tbody');
      tbody.innerHTML = '';
      contadorItemOS = 0;

      if (os.Itens) {
        for (var i = 0; i < os.Itens.length; i++) {
          var item = os.Itens[i];
          adicionarLinhaItemOS(item.Tipo, item.PecaID, item.Descricao, item.Quantidade, item.PrecoUnitario);
        }
      }

      calcularTotalOS();
      document.getElementById('modalOSTitulo').innerHTML = '<i class="fas fa-edit"></i> Editar Ordem de Servico';
      abrirModal('modalOS');
    })

function adicionarItemOS(tipo) {
  if (tipo === 'peca') {
    abrirModalSelecionarPeca('os');
  } else {
    adicionarLinhaItemOS('Servico', '', '', 1, 0);
  }
}

function adicionarLinhaItemOS(tipo, pecaId, descricao, quantidade, precoUnit) {
  contadorItemOS++;
  var tbody = document.querySelector('#tabelaItensOS tbody');

  var tipoLabel = tipo === 'Peca' ? '<span class="status status-pendente">Peca</span>' : '<span class="status status-andamento">Servico</span>';

  var tr = document.createElement('tr');
  tr.id = 'itemOS' + contadorItemOS;
  tr.setAttribute('data-tipo', tipo);
  tr.setAttribute('data-peca-id', pecaId || '');

  tr.innerHTML = '<td>' + tipoLabel + '</td>' +
    '<td><input type="text" class="form-control" value="' + descricao + '" onchange="calcularTotalOS()"></td>' +
    '<td style="width:80px"><input type="number" class="form-control" value="' + quantidade + '" min="1" onchange="calcularTotalOS()"></td>' +
    '<td style="width:120px"><input type="number" class="form-control" value="' + precoUnit + '" step="0.01" onchange="calcularTotalOS()"></td>' +
    '<td style="width:120px"><input type="text" class="form-control" value="' + formatarMoeda(quantidade * precoUnit) + '" readonly></td>' +
    '<td style="width:50px">' +
      '<button class="btn btn-sm btn-danger btn-action" onclick="removerItemOS(' + contadorItemOS + ')">' +
        '<i class="fas fa-trash"></i>' +
      '</button>' +
    '</td>';

  tbody.appendChild(tr);
  calcularTotalOS();
}

function removerItemOS(id) {
  var el = document.getElementById('itemOS' + id);
  if (el) el.parentNode.removeChild(el);
  calcularTotalOS();
}

function calcularTotalOS() {
  var totalPecas = 0;
  var totalMaoObra = 0;

  var linhas = document.querySelectorAll('#tabelaItensOS tbody tr');
  for (var i = 0; i < linhas.length; i++) {
    var tr = linhas[i];
    var tipo = tr.getAttribute('data-tipo');
    var inputs = tr.querySelectorAll('input');
    var qtd = parseFloat(inputs[1].value) || 0;
    var preco = parseFloat(inputs[2].value) || 0;
    var total = qtd * preco;

    inputs[3].value = formatarMoeda(total);

    if (tipo === 'Peca') {
      totalPecas += total;
    } else {
      totalMaoObra += total;
    }
  }

  var desconto = parseFloat(document.getElementById('osDesconto').value) || 0;
  var totalGeral = totalPecas + totalMaoObra - desconto;

  document.getElementById('osTotalPecas').value = formatarMoeda(totalPecas);
  document.getElementById('osTotalMaoObra').value = formatarMoeda(totalMaoObra);
  document.getElementById('osTotalGeral').value = formatarMoeda(totalGeral);
}

function salvarOSForm() {
  var clienteId = document.getElementById('osClienteId').value;
  if (!clienteId) {
    showToast('Selecione um cliente!', 'warning');
    return;
  }

  var descricao = document.getElementById('osDescricao').value;
  if (!descricao) {
    showToast('Preencha a descricao do servico!', 'warning');
    return;
  }

  var itens = [];
  var linhas = document.querySelectorAll('#tabelaItensOS tbody tr');
  for (var i = 0; i < linhas.length; i++) {
    var tr = linhas[i];
    var inputs = tr.querySelectorAll('input');
    itens.push({
      Tipo: tr.getAttribute('data-tipo'),
      PecaID: tr.getAttribute('data-peca-id') || '',
      Descricao: inputs[0].value,
      Quantidade: parseFloat(inputs[1].value) || 0,
      PrecoUnitario: parseFloat(inputs[2].value) || 0,
      PrecoTotal: parseMoeda(inputs[3].value)
    });
  }

  var dados = {
    ID: document.getElementById('osId').value || null,
    ClienteID: clienteId,
    DataPrevista: document.getElementById('osDataPrevista').value,
    Tecnico: document.getElementById('osTecnico').value,
    Descricao: descricao,
    TotalPecas: parseMoeda(document.getElementById('osTotalPecas').value),
    TotalMaoObra: parseMoeda(document.getElementById('osTotalMaoObra').value),
    Desconto: parseFloat(document.getElementById('osDesconto').value) || 0,
    TotalGeral: parseMoeda(document.getElementById('osTotalGeral').value),
    Garantia: document.getElementById('osGarantia').value,
    FormaPagamento: document.getElementById('osFormaPagamento').value,
    Observacoes: document.getElementById('osObservacoes').value,
    Itens: itens
  };

  showLoading();
  google.script.run
    .withSuccessHandler(function(result) {
      hideLoading();
      if (result.success) {
        showToast(result.message, 'success');
        fecharModal('modalOS');
        sincronizarDados();
      } else {
        showToast(result.message, 'error');
      }
    })
    .withFailureHandler(function(error) {
      hideLoading();
      showToast('Erro: ' + error.message, 'error');
    })
    .salvarOrdemServico(dados);
}

function filtrarPecas() {
  var busca = document.getElementById('buscaPeca').value.toLowerCase();

  var linhas = document.querySelectorAll('#tabelaPecas tbody tr');

  for (var i = 0; i < linhas.length; i++) {
    var texto = linhas[i].textContent.toLowerCase();

    var peca = pecas[i];
    if (peca.EstoqueAtual > 0) {
      tbody.innerHTML += '<tr>' +
        '<td>' + peca.Codigo + '</td>' +
        '<td>' + peca.Nome + '</td>' +
        '<td>' + peca.EstoqueAtual + '</td>' +
        '<td>R$ ' + formatarMoeda(peca.PrecoVenda) + '</td>' +
        '<td>' +
          '<button class="btn btn-sm btn-success" onclick="selecionarPeca(' + peca.ID + ')">' +
            '<i class="fas fa-plus"></i>' +
          '</button>' +
        '</td>' +
        '</tr>';
    }
  }
}

function filtrarPecasModal() {
  var busca = document.getElementById('buscaPecaModal').value.toLowerCase();
  var linhas = document.querySelectorAll('#tabelaPecasModal tbody tr');

  for (var i = 0; i < linhas.length; i++) {
    var texto = linhas[i].textContent.toLowerCase();
    linhas[i].style.display = texto.indexOf(busca) >= 0 ? '' : 'none';
  }
}

function selecionarPeca(pecaId) {
  var peca = null;
  for (var i = 0; i < pecas.length; i++) {
    if (pecas[i].ID == pecaId) {
      peca = pecas[i];
      break;
    }
  }
  if (!peca) return;

  var destino = document.getElementById('selecionarPecaCallback').value;

  if (destino === 'orcamento') {
    adicionarLinhaItemOrcamento('Peca', peca.ID, peca.Nome, 1, peca.PrecoVenda);
  } else {
    adicionarLinhaItemOS('Peca', peca.ID, peca.Nome, 1, peca.PrecoVenda);
  }

  fecharModal('modalSelecionarPeca');
}

function renderizarEmailTemplates() {

    'ORCAMENTO_APROVADO': 'Orcamento Aprovado',
    'SERVICO_CONCLUIDO': 'Servico Concluido',

  };

  var tiposDescricoes = {
    'ORCAMENTO_CRIADO': 'Enviado quando um novo orcamento e criado',
    'ORCAMENTO_APROVADO': 'Enviado quando o cliente aprova o orcamento',
    'SERVICO_CONCLUIDO': 'Enviado quando a OS e concluida',

  for (var i = 0; i < emailTemplates.length; i++) {

    grid.innerHTML += '<div class="email-template-card">' +
      '<div class="email-template-header">' +
        '<h4><i class="fas fa-envelope"></i> ' + (tiposNomes[template.Tipo] || template.Tipo) + '</h4>' +

        '<p class="assunto"><strong>Assunto:</strong> ' + template.Assunto + '</p>' +
        '<button class="btn btn-primary btn-block" onclick="editarEmailTemplate(\'' + template.Tipo + '\')">' +
          '<i class="fas fa-edit"></i> Editar Template' +
        '</button>' +
      '</div>' +
      '</div>';
  }
}

function editarEmailTemplate(tipo) {
  var template = null;
  for (var i = 0; i < emailTemplates.length; i++) {
    if (emailTemplates[i].Tipo === tipo) {
      template = emailTemplates[i];
      break;
    }
  }
  if (!template) return;

  document.getElementById('templateTipo').value = template.Tipo;
  document.getElementById('templateAssunto').value = template.Assunto;
  document.getElementById('templateCorpo').value = template.Corpo;
  document.getElementById('templateAtivo').checked = template.Ativo === 'Sim';

  abrirModal('modalEmailTemplate');
}

function salvarEmailTemplateForm() {
  var dados = {
    Tipo: document.getElementById('templateTipo').value,
    Assunto: document.getElementById('templateAssunto').value,
    Corpo: document.getElementById('templateCorpo').value,
    Ativo: document.getElementById('templateAtivo').checked ? 'Sim' : 'Nao'
  };

  showLoading();
  google.script.run
    .withSuccessHandler(function(result) {
      hideLoading();
      if (result.success) {
        showToast(result.message, 'success');
        fecharModal('modalEmailTemplate');
        sincronizarDados();
      } else {
        showToast(result.message, 'error');
      }
    })
    .withFailureHandler(function(error) {
      hideLoading();
      showToast('Erro: ' + error.message, 'error');
    })
    .salvarEmailTemplate(dados);
}

function popularSelectFormasPagamento() {
  var formasStr = configuracoes.FORMAS_PAGAMENTO || '';
  var formas = formasStr.split(',');
  var selects = ['orcamentoFormaPagamento', 'osFormaPagamento'];

  for (var s = 0; s < selects.length; s++) {
    var select = document.getElementById(selects[s]);
    if (!select) continue;

    var valorAtual = select.value;
    select.innerHTML = '<option value="">Selecione...</option>';

    for (var i = 0; i < formas.length; i++) {
      var forma = formas[i].trim();
      if (forma) {
        select.innerHTML += '<option value="' + forma + '">' + forma + '</option>';
      }
    }

    if (valorAtual) select.value = valorAtual;
  }
}

// ==================== FUNCOES UTILITARIAS ====================

function formatarMoeda(valor) {
  return parseFloat(valor || 0).toFixed(2).replace('.', ',');
}

function parseMoeda(valor) {
  return parseFloat((valor || '0').replace(',', '.')) || 0;
}

function formatarDataInput(dataStr) {
  if (!dataStr) return '';
  var partes = dataStr.split('/');
  if (partes.length === 3) {
    var dia = partes[0].length < 2 ? '0' + partes[0] : partes[0];
    var mes = partes[1].length < 2 ? '0' + partes[1] : partes[1];
    return partes[2] + '-' + mes + '-' + dia;
  }
  return dataStr;
}
